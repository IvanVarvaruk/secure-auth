services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureauth
      POSTGRES_PASSWORD: secureauth
      POSTGRES_DB: secureauth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Локальний SMTP-сервер для демонстрації листів (веб-інтерфейс: http://localhost:8025)
  mail:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
